[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "foreign-trade-geo-agent"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "geo-optimizer-skill==4.18.1",
    "httpx>=0.27,<1",
]

[tool.setuptools.packages.find]
where = ["src"]
