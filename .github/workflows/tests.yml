name: Unit tests

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: unit-tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unittest:
    name: Windows / Python 3.12
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Create local virtual environment
        run: python -m venv .venv
      - name: Install project and demo dependencies
        run: .\.venv\Scripts\python.exe -m pip install -e ".[demo]"
      - name: Run offline unit tests
        run: .\.venv\Scripts\python.exe -m unittest discover -s tests -p "test_*.py" -v
