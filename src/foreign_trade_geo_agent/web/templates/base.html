<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}SEO Agent MVP{% endblock %}</title>
    <link rel="stylesheet" href="/static/app.css">
    <script src="/static/htmx-2.0.11.min.js" defer></script>
  </head>
  <body>
    {% include "partials/workflow_rail.html" %}
    <div class="page-shell">
      <header class="context-bar">
        {% if profile == "live" %}
          <strong>Live Analysis</strong>
          <span>Public HTTPS · bounded evidence workflow · Draft Review terminal</span>
        {% else %}
          <strong>Demo Mode · NovaCNC Machinery</strong>
          <span>Deterministic local snapshot · no external services</span>
        {% endif %}
      </header>
      <main>{% block content %}{% endblock %}</main>
    </div>
  </body>
</html>
